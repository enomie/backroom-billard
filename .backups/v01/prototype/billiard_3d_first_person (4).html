<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>First Person 3D Billiard - Le Salon Noir</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;600&display=swap');

    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #020204;
      font-family: 'Inter', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    #canvas-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Starke, geheimnisvolle Salon-Vignette */
    .salon-vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at center, rgba(0,0,0,0) 25%, rgba(2, 3, 5, 0.75) 65%, rgba(0, 1, 2, 0.98) 100%);
    }

    .hud-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    .interactive {
      pointer-events: auto;
    }

    .font-cinzel {
      font-family: 'Cinzel', serif;
    }

    /* Dezentes Glühen für Stoß-Button */
    .glow-amber {
      box-shadow: 0 0 15px rgba(217, 119, 6, 0.35);
      transition: all 0.2s ease;
    }
    .glow-amber:hover {
      box-shadow: 0 0 25px rgba(217, 119, 6, 0.6);
      transform: translateY(-1px);
    }
    .glow-amber:active {
      transform: translateY(1px);
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="bg-[#020204] text-neutral-200">

  <!-- 3D Viewport -->
  <div id="canvas-container"></div>
  <div class="salon-vignette"></div>

  <!-- Minimalistisches, edles Salon-HUD -->
  <div class="hud-layer flex flex-col justify-between p-4 md:p-6">
    <!-- Header -->
    <header class="flex justify-between items-start">
      <div>
        <h1 class="text-lg md:text-2xl font-black tracking-widest font-cinzel text-amber-100/90 drop-shadow">
          LE SALON NOIR
        </h1>
        <div class="flex items-center gap-2 mt-0.5">
          <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_#10b981]"></span>
          <span id="status-text" class="text-xs text-neutral-400 font-medium tracking-wide">
            Bereit zum Stoß
          </span>
        </div>
      </div>

      <div class="flex items-center space-x-2 interactive">
        <button id="btn-camera" class="px-3 py-1.5 bg-neutral-900/80 hover:bg-neutral-800 text-amber-200/90 text-xs font-semibold uppercase tracking-wider rounded border border-neutral-800 backdrop-blur transition">
          Kamera: <span id="cam-label" class="text-white font-bold">FP Queue</span>
        </button>
        <button id="btn-reset" class="px-3 py-1.5 bg-amber-950/60 hover:bg-amber-900/80 text-amber-200 text-xs font-bold uppercase tracking-wider rounded border border-amber-900/50 backdrop-blur transition">
          Neu aufbauen
        </button>
      </div>
    </header>

    <!-- Fadenkreuz im First Person Modus -->
    <div id="aim-crosshair" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none flex items-center justify-center opacity-70">
      <div class="w-6 h-6 rounded-full border border-amber-400/40 flex items-center justify-center">
        <div class="w-1 h-1 bg-amber-300 rounded-full shadow-[0_0_5px_#fde047]"></div>
      </div>
    </div>

      <!-- Steuerungs-Hinweise -->
      <div class="bg-black/75 backdrop-blur-md border border-neutral-800 p-3 rounded-xl text-xs text-neutral-300 max-w-sm shadow-xl hidden sm:block">
        <div class="text-amber-400 font-semibold mb-1 flex items-center gap-1.5">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          Steuerung
        </div>
        <ul class="space-y-0.5 text-neutral-300/90 leading-tight">
          <li>• <b class="text-white">Maus ziehen / [A][D]:</b> Zielen</li>
          <li>• <b class="text-white">Mausrad:</b> Stoßkraft stufenlos einstellen</li>
          <li>• <b class="text-white">Klick / [Leertaste]:</b> Kugel stoßen</li>
          <li>• <b class="text-white">[C]:</b> Kamera-Wechsel | <b class="text-white">[R]:</b> Reset</li>
        </ul>
      </div>

      <!-- Direkte Power & Feuerleiste -->
      <div class="flex items-center gap-3 w-full md:w-auto interactive bg-neutral-950/85 p-3 rounded-2xl border border-amber-500/30 backdrop-blur-md shadow-2xl">
        <div class="flex flex-col gap-1 w-32 sm:w-44">
          <div class="flex justify-between text-xs text-amber-300 font-bold uppercase tracking-wider">
            <span>Kraft (Mausrad)</span>
            <span id="power-percent">40%</span>
          </div>
          <input id="power-slider" type="range" min="10" max="100" value="40" class="w-full accent-amber-400 cursor-pointer h-2 bg-neutral-800 rounded-lg">
          <!-- Power Bar Anzeige -->
          <div class="w-full h-2 bg-neutral-900 rounded-full overflow-hidden border border-amber-500/20">
            <div id="power-fill" class="h-full bg-gradient-to-r from-emerald-500 via-amber-400 to-rose-600 transition-all duration-75" style="width: 40%;"></div>
          </div>
        </div>

        <!-- 100% Sicherer Stoß-Button -->
        <button id="btn-fire-shot" class="btn-fire-glow flex items-center justify-center gap-1.5 px-5 py-3.5 bg-gradient-to-r from-amber-500 via-amber-400 to-amber-600 active:scale-95 text-neutral-950 font-black text-xs md:text-sm uppercase tracking-wider rounded-xl shadow-lg border border-amber-300 transition duration-150 cursor-pointer">
          <svg class="w-4 h-4 text-neutral-950" fill="currentColor" viewBox="0 0 20 20"><path d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"/></svg>
          <span>STOSSEN</span>
        </button>
      </div>
    </footer>
  </div>

  <script>
    /* ====================================================
       1. GLOBALE VARIABLEN & KONSTANTEN
    ==================================================== */
    let scene, camera, renderer;
    let balls = []; // { mesh, pos, vel, radius, isCue, id, inPocket }
    let cueBall = null;
    let cueStickPivot, cueStickMesh, aimLine;

    // Tisch-Parameter
    const PLAY_L = 2.44;   // Spielfeldlänge (Z)
    const PLAY_W = 1.22;   // Spielfeldbreite (X)
    const TABLE_H = 0.85;  // Höhe des Tisches
    const BALL_R = 0.036;  // Kugelradius (3.6 cm)
    const POCKET_R = 0.075; // Radius der Taschen / Löcher
    const HALF_W = PLAY_W / 2 - BALL_R;
    const HALF_L = PLAY_L / 2 - BALL_R;

    // Zustand
    let cameraMode = 'fps'; // 'fps' oder 'overhead'
    let aimAngle = Math.PI * 0.5; // Zielen um weiße Kugel
    let aimPitch = 0.12;
    let selectedPower = 0.40; // 0.10 bis 1.0 (Standard: sanfte 40%)
    let isCueMoving = false;
    let cueStrikeAnim = 0; // Für visuelle Vorstoß-Animation

    // Audio-Context für synthetische Kugel-Kollisionsgeräusche
    let audioCtx = null;
    function playClackSound(volume = 0.5, pitch = 800) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.06);
        gain.gain.setValueAtTime(Math.min(volume, 1.0) * 0.45, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.07);
      } catch (e) {}
    }

    /* ====================================================
       2. THREE.JS SZENE & ATMOSPHÄRE
    ==================================================== */
    function init() {
      const container = document.getElementById('canvas-container');

      // 2.1 Szene & Nebel (Salon-Atmosphäre ohne störenden Staub/Schnee)
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x06070a);
      scene.fog = new THREE.FogExp2(0x06070a, 0.07);

      // 2.2 Kamera
      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.05, 50);
      camera.position.set(0, TABLE_H + 1.2, 2.0);

      // 2.3 Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;
      container.appendChild(renderer.domElement);

      // 2.4 Licht & Salon
      setupLightingAndRoom();

      // 2.5 Tisch & Taschen mit echten Löchern
      buildAuthenticTableWithHoles();

      // 2.6 Kugeln initialisieren
      setupBalls();

      // 2.7 Queue & Ziellinie
      setupCueAndAimLine();

      // 2.8 Events & UI
      setupControls();

      // Animation Loop starten
      requestAnimationFrame(gameLoop);
    }

    function setupLightingAndRoom() {
      // Schwaches, gedimmtes Grundlicht
      const ambLight = new THREE.AmbientLight(0x111622, 0.4);
      scene.add(ambLight);

      // Warmer Decken-Spot über dem Tisch
      const lampY = TABLE_H + 1.4;
      const spot = new THREE.SpotLight(0xffdfa4, 4.5);
      spot.position.set(0, lampY, 0);
      spot.angle = Math.PI / 3.4;
      spot.penumbra = 0.55;
      spot.decay = 1.4;
      spot.distance = 6.0;
      spot.castShadow = true;
      spot.shadow.mapSize.width = 2048;
      spot.shadow.mapSize.height = 2048;
      spot.shadow.bias = -0.0003;
      spot.target.position.set(0, TABLE_H, 0);
      scene.add(spot);
      scene.add(spot.target);

      // Glüh-Punktlicht an der Lampe
      const bulb = new THREE.PointLight(0xffa834, 1.2, 3.0);
      bulb.position.set(0, lampY - 0.05, 0);
      scene.add(bulb);

      // Lampenschirm (Klassisches Messing / Dunkelgrün)
      const shade = new THREE.Mesh(
        new THREE.ConeGeometry(0.35, 0.22, 32, 1, true),
        new THREE.MeshStandardMaterial({ color: 0x0f291e, roughness: 0.3, metalness: 0.7, side: THREE.DoubleSide })
      );
      shade.position.set(0, lampY + 0.08, 0);
      scene.add(shade);

      // Volumetrischer warmer Lichtkegel
      const coneHeight = 1.38;
      const coneR = Math.tan(spot.angle) * coneHeight * 0.95;
      const coneGeo = new THREE.ConeGeometry(coneR, coneHeight, 32, 1, true);
      coneGeo.translate(0, -coneHeight / 2, 0);
      const lightCone = new THREE.Mesh(
        coneGeo,
        new THREE.MeshBasicMaterial({
          color: 0xffd290,
          transparent: true,
          opacity: 0.08,
          side: THREE.BackSide,
          depthWrite: false,
          blending: THREE.AdditiveBlending
        })
      );
      lightCone.position.set(0, lampY, 0);
      scene.add(lightCone);

      // Dunkler Salon-Boden
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 16),
        new THREE.MeshStandardMaterial({ color: 0x08090d, roughness: 0.9 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);
    }

    /* ====================================================
       3. TISCH MIT ECHTEN LÖCHERN & PRÄZISEN BANDENSEGMENTEN
    ==================================================== */
    // 6 Taschen-Positionen
    const pockets = [];
    const cushions = []; // Banden-Kollisionssegmente: { x1, z1, x2, z2, nx, nz }

    function buildAuthenticTableWithHoles() {
      const hw = PLAY_W / 2;
      const hl = PLAY_L / 2;

      // Definierte Taschen-Mittelpunkte (4 Ecken, 2 Mitten)
      const pocketCoords = [
        { x: -hw + 0.015, z: -hl + 0.015, isSide: false }, // Oben Links
        { x:  hw - 0.015, z: -hl + 0.015, isSide: false }, // Oben Rechts
        { x: -hw - 0.008, z:  0,           isSide: true  }, // Mitte Links
        { x:  hw + 0.008, z:  0,           isSide: true  }, // Mitte Rechts
        { x: -hw + 0.015, z:  hl - 0.015, isSide: false }, // Unten Links
        { x:  hw - 0.015, z:  hl - 0.015, isSide: false }  // Unten Rechts
      ];

      // 3.1 Filz-Tischplatte mit ECHTEN 6 LÖCHERN (Shape mit 6 Loch-Pfaden ausgestanzt)
      const feltShape = new THREE.Shape();
      feltShape.moveTo(-hw, -hl);
      feltShape.lineTo( hw, -hl);
      feltShape.lineTo( hw,  hl);
      feltShape.lineTo(-hw,  hl);
      feltShape.closePath();

      // 6 Löcher aus dem Tuch stanzen
      pocketCoords.forEach(p => {
        const holePath = new THREE.Path();
        const r = p.isSide ? POCKET_R * 0.95 : POCKET_R;
        holePath.absarc(p.x, p.z, r, 0, Math.PI * 2, true);
        feltShape.holes.push(holePath);

        pockets.push({
          x: p.x,
          z: p.z,
          radius: r,
          isSide: p.isSide
        });
      });

      // Extrudiertes Tuch (echte Tiefe mit Lochbohrungen)
      const extrudeSettings = { depth: 0.045, bevelEnabled: false };
      const bedGeo = new THREE.ExtrudeGeometry(feltShape, extrudeSettings);
      bedGeo.rotateX(Math.PI / 2);
      bedGeo.translate(0, TABLE_H, 0);

      // Edler, matter Petrol-Grüner Billard-Filz
      const feltMat = new THREE.MeshStandardMaterial({
        color: 0x0a4032,
        roughness: 0.90,
        metalness: 0.01
      });
      const bedMesh = new THREE.Mesh(bedGeo, feltMat);
      bedMesh.receiveShadow = true;
      scene.add(bedMesh);

      // 3.2 Tiefe Taschenbecher & Messing-/Leder-Einlässe unter den Löchern
      const pocketCupMat = new THREE.MeshStandardMaterial({ color: 0x080808, roughness: 0.95 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xb58b38, metalness: 0.8, roughness: 0.3 }); // Messingrand

      pockets.forEach(p => {
        // Offener Becher nach unten, in den die Kugeln fallen
        const cupGeo = new THREE.CylinderGeometry(p.radius, p.radius * 0.75, 0.16, 24, 1, true);
        const cup = new THREE.Mesh(cupGeo, pocketCupMat);
        cup.position.set(p.x, TABLE_H - 0.08, p.z);
        scene.add(cup);

        // Boden der Tasche
        const cupBottom = new THREE.Mesh(new THREE.CircleGeometry(p.radius * 0.75, 24), pocketCupMat);
        cupBottom.rotation.x = -Math.PI / 2;
        cupBottom.position.set(p.x, TABLE_H - 0.16, p.z);
        scene.add(cupBottom);

        // Taschenring oben
        const ring = new THREE.Mesh(new THREE.TorusGeometry(p.radius, 0.012, 12, 24), rimMat);
        ring.rotation.x = Math.PI / 2;
        ring.position.set(p.x, TABLE_H + 0.002, p.z);
        scene.add(ring);
      });

      // 3.3 Echtes Mahagoni-Holz & 6 separate Bandensegmente (mit Aussparung für alle Löcher!)
      const woodMat = new THREE.MeshStandardMaterial({ color: 0x1f0c05, roughness: 0.25, metalness: 0.12 });
      const cushionRubberMat = new THREE.MeshStandardMaterial({ color: 0x08382b, roughness: 0.85 });

      const railH = 0.055; // Bandenhöhe über Tuch
      const railThick = 0.12;

      // Hilfsfunktion: Trapez-förmige Banden mit Schrägen zu den Taschen
      function createCushionSegment(x1, z1, x2, z2, normalX, normalZ) {
        // Kollisionslinie für Physik
        cushions.push({ x1, z1, x2, z2, nx: normalX, nz: normalZ });

        // Visuelle Bandenkante (Gummilippe)
        const dx = x2 - x1;
        const dz = z2 - z1;
        const len = Math.hypot(dx, dz);
        const angle = Math.atan2(dx, dz);

        const group = new THREE.Group();
        group.position.set((x1 + x2) / 2, TABLE_H + railH / 2, (z1 + z2) / 2);
        group.rotation.y = angle;

        // Bandengummi
        const rubber = new THREE.Mesh(new THREE.BoxGeometry(0.024, railH, len), cushionRubberMat);
        rubber.castShadow = true;
        group.add(rubber);

        // Äußere massive Mahagoni-Schiene
        const woodRail = new THREE.Mesh(new THREE.BoxGeometry(railThick, railH + 0.01, len + 0.03), woodMat);
        woodRail.position.set(-normalX * (railThick / 2 + 0.01), 0.005, -normalZ * (railThick / 2 + 0.01));
        woodRail.castShadow = true;
        group.add(woodRail);

        scene.add(group);
      }

      // Bandenschnitt-Kanten mit Aussparungen für Taschen:
      const cornerOffset = 0.105;
      const sideOffset = 0.075;

      // 1. Kopfbande Oben (Z = -hl)
      createCushionSegment(-hw + cornerOffset, -hl, hw - cornerOffset, -hl, 0, 1);
      // 2. Fußbande Unten (Z = +hl)
      createCushionSegment(-hw + cornerOffset,  hl, hw - cornerOffset,  hl, 0, -1);

      // 3. Linke Seite Oben (X = -hw)
      createCushionSegment(-hw, -hl + cornerOffset, -hw, -sideOffset, 1, 0);
      // 4. Linke Seite Unten (X = -hw)
      createCushionSegment(-hw, sideOffset, -hw,  hl - cornerOffset, 1, 0);

      // 5. Rechte Seite Oben (X = +hw)
      createCushionSegment( hw, -hl + cornerOffset,  hw, -sideOffset, -1, 0);
      // 6. Rechte Seite Unten (X = +hw)
      createCushionSegment( hw, sideOffset,  hw,  hl - cornerOffset, -1, 0);

      // Tischbeine
      const legGeo = new THREE.CylinderGeometry(0.075, 0.055, TABLE_H, 16);
      [
        [-hw - 0.04, TABLE_H / 2, -hl - 0.04],
        [ hw + 0.04, TABLE_H / 2, -hl - 0.04],
        [-hw - 0.04, TABLE_H / 2,  hl + 0.04],
        [ hw + 0.04, TABLE_H / 2,  hl + 0.04]
      ].forEach(pos => {
        const leg = new THREE.Mesh(legGeo, woodMat);
        leg.position.set(...pos);
        leg.castShadow = true;
        scene.add(leg);
      });
    }

    /* ====================================================
       4. HOCHGLÄNZENDE KUGELN MIT REFLEXIONEN
    ==================================================== */
    function setupBalls() {
      balls.forEach(b => scene.remove(b.mesh));
      balls = [];

      const sphereGeo = new THREE.SphereGeometry(BALL_R, 32, 32);

      // Satte, edle Poolfarben
      const ballColors = [
        0xf59e0b, 0x1d4ed8, 0xdc2626, 0x6d28d9, 0xea580c,
        0x15803d, 0x881337, 0x111827, 0xfacc15, 0x0284c7,
        0xef4444, 0x8b5cf6, 0xf97316, 0x22c55e, 0x4c0519
      ];

      function createBall(x, z, colorHex, isCue = false, id = 0) {
        const mat = new THREE.MeshPhysicalMaterial({
          color: colorHex,
          roughness: 0.03,
          metalness: 0.04,
          clearcoat: 1.0,
          clearcoatRoughness: 0.03,
          reflectivity: 0.98
        });
        const mesh = new THREE.Mesh(sphereGeo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.position.set(x, TABLE_H + BALL_R, z);
        scene.add(mesh);

        const bObj = {
          mesh,
          pos: new THREE.Vector3(x, TABLE_H + BALL_R, z),
          vel: new THREE.Vector3(0, 0, 0),
          radius: BALL_R,
          isCue,
          id,
          falling: false,
          inPocket: false
        };
        balls.push(bObj);
        return bObj;
      }

      // Weiße Kugel
      cueBall = createBall(0, PLAY_L * 0.28, 0xf8fafc, true, 0);

      // Dreiecks-Anordnung
      const startZ = -PLAY_L * 0.22;
      const rows = 5;
      let idx = 0;
      const rowGap = BALL_R * Math.sqrt(3) + 0.0008;

      for (let r = 0; r < rows; r++) {
        const count = r + 1;
        const startX = -((count - 1) * BALL_R * 1.02);
        for (let c = 0; c < count; c++) {
          const px = startX + c * (BALL_R * 2.04);
          const pz = startZ - r * rowGap;
          createBall(px, pz, ballColors[idx % ballColors.length], false, idx + 1);
          idx++;
        }
      }
    }

    /* ====================================================
       5. FIRST-PERSON QUEUE & ZIELLINIE
    ==================================================== */
    function setupCueAndAimLine() {
      cueStickPivot = new THREE.Group();
      scene.add(cueStickPivot);

      // Billardqueue aus Holz mit Verjüngung
      const stickGeo = new THREE.CylinderGeometry(0.0065, 0.015, 1.45, 24);
      stickGeo.translate(0, 0.725, 0);
      stickGeo.rotateX(Math.PI / 2);
      const cueMat = new THREE.MeshStandardMaterial({ color: 0xd4a373, roughness: 0.4, metalness: 0.05 });
      cueStickMesh = new THREE.Mesh(stickGeo, cueMat);
      cueStickMesh.castShadow = true;
      cueStickPivot.add(cueStickMesh);

      // Blaue Kreidespitze
      const tip = new THREE.Mesh(
        new THREE.CylinderGeometry(0.0067, 0.0067, 0.025, 16),
        new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.6 })
      );
      tip.translateZ(0.012);
      tip.rotateX(Math.PI / 2);
      cueStickMesh.add(tip);

      // Edle punktierte Ziellinie
      const points = [new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 0, -2.2)];
      const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
      aimLine = new THREE.Line(
        lineGeo,
        new THREE.LineDashedMaterial({ color: 0xfde047, dashSize: 0.045, gapSize: 0.035, transparent: true, opacity: 0.75 })
      );
      aimLine.computeLineDistances();
      scene.add(aimLine);
    }

    /* ====================================================
       6. FEHLERFREIE & AUSBALANCIERTE STOSS-MECHANIK
    ==================================================== */
    function fireCueStrike() {
      if (!cueBall || cueBall.inPocket) return;

      // Akustischer Klick
      playClackSound(selectedPower * 0.8, 900);

      // Sanft ausbalancierte Stoßkraft (Realistisches Rollverhalten statt Übergeschwindigkeit)
      const impulseStrength = 0.8 + selectedPower * 3.4;
      const dirX = -Math.sin(aimAngle);
      const dirZ = -Math.cos(aimAngle);

      cueBall.vel.x = dirX * impulseStrength;
      cueBall.vel.z = dirZ * impulseStrength;

      // Visuelle Schnapp-Animation des Queues
      cueStrikeAnim = 1.0;

      // Status UI aktualisieren
      updateStatusDisplay(true);
    }

    function updateStatusDisplay(moving) {
      isCueMoving = moving;
      const dot = document.getElementById('status-dot');
      const txt = document.getElementById('status-text');
      if (moving) {
        dot.className = 'w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_6px_#f59e0b] animate-pulse';
        txt.innerText = 'Kugeln rollen...';
        txt.className = 'text-xs text-amber-300 font-medium tracking-wide';
      } else {
        dot.className = 'w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_6px_#10b981]';
        txt.innerText = 'Bereit zum Stoß';
        txt.className = 'text-xs text-neutral-400 font-medium tracking-wide';
      }
    }

    /* ====================================================
       7. INTERAKTIONEN, MAUSRAD-STEUERUNG & EVENTS
    ==================================================== */
    function setupControls() {
      const container = renderer.domElement;
      let isMouseDown = false;
      let lastX = 0, lastY = 0;
      let totalDragDist = 0;

      // Power UI Helfer
      const slider = document.getElementById('power-slider');
      const powerFill = document.getElementById('power-fill');
      const powerPct = document.getElementById('power-percent');

      function setPower(val) {
        selectedPower = Math.max(0.10, Math.min(1.0, val));
        const pct = Math.round(selectedPower * 100);
        slider.value = pct;
        powerFill.style.width = pct + '%';
        powerPct.innerText = pct + '%';
      }

      slider.addEventListener('input', (e) => {
        setPower(e.target.value / 100);
      });

      // MAUSRAD-STEUERUNG: Stoßkraft stufenlos & präzise einstellen
      window.addEventListener('wheel', (e) => {
        // Nach oben scrollen (-deltaY) = mehr Kraft, nach unten (+deltaY) = weniger Kraft
        const delta = -Math.sign(e.deltaY) * 0.05;
        setPower(selectedPower + delta);
      }, { passive: true });

      // Direkter On-Screen Stoß-Button
      const fireBtn = document.getElementById('btn-fire-shot');
      fireBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        fireCueStrike();
      });

      // Maussteuerung (Klicken & Ziehen zum Zielen, Klick ohne Drag = Stoß)
      container.addEventListener('mousedown', (e) => {
        if (e.button === 0) {
          isMouseDown = true;
          totalDragDist = 0;
          lastX = e.clientX;
          lastY = e.clientY;
        }
      });

      window.addEventListener('mouseup', (e) => {
        if (isMouseDown) {
          // Wurde die Maus nur kurz geklickt (ohne Zieldrehung) -> Stoß ausführen!
          if (totalDragDist < 5) {
            fireCueStrike();
          }
        }
        isMouseDown = false;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isMouseDown) return;
        const dx = e.clientX - lastX;
        const dy = e.clientY - lastY;
        totalDragDist += Math.abs(dx) + Math.abs(dy);
        lastX = e.clientX;
        lastY = e.clientY;

        // Horizontales Zielen
        aimAngle -= dx * 0.0055;
        // Vertikale Neigung
        aimPitch = Math.max(0.04, Math.min(0.40, aimPitch + dy * 0.002));
      });

      // Tastatur-Steuerung: Pfeiltasten / A & D zum Zielen, Leertaste zum Stoßen
      window.addEventListener('keydown', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') {
          aimAngle += 0.05;
        }
        if (e.code === 'ArrowRight' || e.code === 'KeyD') {
          aimAngle -= 0.05;
        }
        if (e.code === 'ArrowUp' || e.code === 'KeyW') {
          setPower(selectedPower + 0.05);
        }
        if (e.code === 'ArrowDown' || e.code === 'KeyS') {
          setPower(selectedPower - 0.05);
        }
        if (e.code === 'Space' && !e.repeat) {
          fireCueStrike();
        }
        if (e.code === 'KeyC') {
          toggleCamera();
        }
        if (e.code === 'KeyR') {
          setupBalls();
        }
      });

      // Touch Steuerung für Mobile
      let touchX = 0;
      let touchMoved = false;
      container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchX = e.touches[0].clientX;
          touchMoved = false;
        }
      }, { passive: true });

      container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          const dx = e.touches[0].clientX - touchX;
          if (Math.abs(dx) > 3) touchMoved = true;
          touchX = e.touches[0].clientX;
          aimAngle -= dx * 0.006;
        }
      }, { passive: true });

      container.addEventListener('touchend', () => {
        if (!touchMoved) {
          fireCueStrike();
        }
      });

      // Header Buttons
      document.getElementById('btn-camera').addEventListener('click', toggleCamera);
      document.getElementById('btn-reset').addEventListener('click', () => {
        setupBalls();
        updateStatusDisplay(false);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    function toggleCamera() {
      cameraMode = cameraMode === 'fps' ? 'overhead' : 'fps';
      document.getElementById('cam-label').innerText = cameraMode === 'fps' ? 'FP Queue' : 'Draufsicht';
      document.getElementById('aim-crosshair').style.display = cameraMode === 'fps' ? 'flex' : 'none';
      cueStickPivot.visible = cameraMode === 'fps';
      aimLine.visible = cameraMode === 'fps';
    }

    /* ====================================================
       8. EXAKTE PHYSIK-SIMULATION (Kugeln, Banden, Taschen)
    ==================================================== */
    function updatePhysics(dt) {
      const friction = 0.985; // Realistische Ausrollreibung auf Billardtuch
      let totalMotion = 0;

      // 8.1 Bewegung & Bandenreflexion
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (b.inPocket) continue;

        // Position aktualisieren
        b.pos.x += b.vel.x * dt;
        b.pos.z += b.vel.z * dt;

        // Reibung anwenden
        b.vel.x *= Math.pow(friction, dt * 60);
        b.vel.z *= Math.pow(friction, dt * 60);

        const speedSq = b.vel.x * b.vel.x + b.vel.z * b.vel.z;
        if (speedSq < 0.0003) {
          b.vel.x = 0;
          b.vel.z = 0;
        } else {
          totalMotion += speedSq;
        }

        // Banden-Kollision (X-Achse) mit Dämpfung
        if (b.pos.x < -HALF_W) {
          b.pos.x = -HALF_W;
          b.vel.x = -b.vel.x * 0.82;
          playClackSound(Math.min(Math.abs(b.vel.x) * 0.4, 0.5), 550);
        } else if (b.pos.x > HALF_W) {
          b.pos.x = HALF_W;
          b.vel.x = -b.vel.x * 0.82;
          playClackSound(Math.min(Math.abs(b.vel.x) * 0.4, 0.5), 550);
        }

        // Banden-Kollision (Z-Achse) mit Dämpfung
        if (b.pos.z < -HALF_L) {
          b.pos.z = -HALF_L;
          b.vel.z = -b.vel.z * 0.82;
          playClackSound(Math.min(Math.abs(b.vel.z) * 0.4, 0.5), 550);
        } else if (b.pos.z > HALF_L) {
          b.pos.z = HALF_L;
          b.vel.z = -b.vel.z * 0.82;
          playClackSound(Math.min(Math.abs(b.vel.z) * 0.4, 0.5), 550);
        }

        // Taschen-Erkennung (Löcher)
        for (let p = 0; p < pockets.length; p++) {
          const pock = pockets[p];
          const distSq = (b.pos.x - pock.x) ** 2 + (b.pos.z - pock.z) ** 2;
          if (distSq < pock.radius * pock.radius) {
            b.inPocket = true;
            b.vel.set(0, 0, 0);
            b.mesh.position.y = -10; // Kugel fällt in die Tasche

            // Falls weiße Spielkugel versenkt wurde -> Neu aufstellen
            if (b.isCue) {
              setTimeout(() => {
                b.inPocket = false;
                b.pos.set(0, TABLE_H + BALL_R, PLAY_L * 0.28);
                b.vel.set(0, 0, 0);
              }, 600);
            }
            break;
          }
        }
      }

      // 8.2 Elastische Kugel-zu-Kugel-Kollisionen
      const diam = BALL_R * 2;
      const diamSq = diam * diam;

      for (let i = 0; i < balls.length; i++) {
        const b1 = balls[i];
        if (b1.inPocket) continue;

        for (let j = i + 1; j < balls.length; j++) {
          const b2 = balls[j];
          if (b2.inPocket) continue;

          const dx = b2.pos.x - b1.pos.x;
          const dz = b2.pos.z - b1.pos.z;
          const distSq = dx * dx + dz * dz;

          if (distSq < diamSq && distSq > 0.000001) {
            const dist = Math.sqrt(distSq);
            const nx = dx / dist;
            const nz = dz / dist;

            // Überlappung korrigieren
            const overlap = (diam - dist) * 0.5;
            b1.pos.x -= nx * overlap;
            b1.pos.z -= nz * overlap;
            b2.pos.x += nx * overlap;
            b2.pos.z += nz * overlap;

            // Impulsübertragung entlang Normalen
            const kx = b1.vel.x - b2.vel.x;
            const kz = b1.vel.z - b2.vel.z;
            const p = 2 * (nx * kx + nz * kz) / 2;

            b1.vel.x -= p * nx * 0.94;
            b1.vel.z -= p * nz * 0.94;
            b2.vel.x += p * nx * 0.94;
            b2.vel.z += p * nz * 0.94;

            const impactSpeed = Math.abs(p);
            if (impactSpeed > 0.08) {
              playClackSound(impactSpeed * 0.4, 750 + Math.random() * 200);
            }
          }
        }
      }

      // Meshes auf Physik-Positionen setzen + Kugelrotation
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        if (!b.inPocket) {
          b.mesh.position.set(b.pos.x, b.pos.y, b.pos.z);
          const speed = Math.sqrt(b.vel.x * b.vel.x + b.vel.z * b.vel.z);
          if (speed > 0.001) {
            const rotAxis = new THREE.Vector3(b.vel.z, 0, -b.vel.x).normalize();
            b.mesh.rotateOnWorldAxis(rotAxis, (speed * dt) / BALL_R);
          }
        }
      }

      // Statusindikator anpassen
      const moving = totalMotion > 0.01;
      if (moving !== isCueMoving) {
        updateStatusDisplay(moving);
      }
    }

    /* ====================================================
       9. GAME LOOP
    ==================================================== */
    let lastTime = performance.now();

    function gameLoop(currentTime) {
      requestAnimationFrame(gameLoop);

      const dt = Math.min((currentTime - lastTime) / 1000, 0.033);
      lastTime = currentTime;

      // Physikschritt
      updatePhysics(dt);

      // Queue-Positionierung & Abstand angepasst an das Mausrad
      if (cueBall && cueStickPivot) {
        cueStickPivot.position.set(cueBall.pos.x, cueBall.pos.y, cueBall.pos.z);
        cueStickPivot.rotation.y = aimAngle;

        // Der Queue zieht sich proportional zum eingestellten Mausrad-Powerwert zurück!
        let cueDist = 0.05 + selectedPower * 0.28;
        if (cueStrikeAnim > 0) {
          // Stoß schnellt beim Treffen vor
          cueDist = THREE.MathUtils.lerp(0.012, cueDist, 1 - cueStrikeAnim);
          cueStrikeAnim = Math.max(0, cueStrikeAnim - dt * 6.5);
        }

        cueStickMesh.position.set(0, 0.015 + aimPitch * 0.1, cueDist);
        cueStickMesh.rotation.x = aimPitch;

        // Ziellinie an der Kugel ausrichten
        if (aimLine) {
          aimLine.position.set(cueBall.pos.x, cueBall.pos.y - BALL_R + 0.002, cueBall.pos.z);
          aimLine.rotation.y = aimAngle;
        }
      }

      // Kamera-Positionierung
      if (cameraMode === 'fps' && cueBall) {
        const camDist = 0.62;
        const camH = 0.25 + aimPitch * 0.45;
        const targetX = cueBall.pos.x + Math.sin(aimAngle) * camDist;
        const targetZ = cueBall.pos.z + Math.cos(aimAngle) * camDist;
        const targetY = cueBall.pos.y + camH;

        camera.position.lerp(new THREE.Vector3(targetX, targetY, targetZ), 0.18);
        camera.lookAt(cueBall.pos.x - Math.sin(aimAngle) * 1.8, cueBall.pos.y, cueBall.pos.z - Math.cos(aimAngle) * 1.8);
      } else if (cameraMode === 'overhead') {
        camera.position.lerp(new THREE.Vector3(0, TABLE_H + 2.6, 0.01), 0.08);
        camera.lookAt(0, TABLE_H, 0);
      }

      renderer.render(scene, camera);
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
