<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Backroom Billard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="canvas-container"></div>

    <!-- Game over: game lost / you win -->
    <div id="game-over" class="game-over" hidden>
      <div class="game-over__panel">
        <h2 id="game-over-title" class="game-over__title">GAME LOST</h2>
        <p id="game-over-text" class="game-over__text"></p>
        <button id="btn-restart" type="button" class="btn btn--reset" data-i18n="button.rerack">Re-rack</button>
      </div>
    </div>

    <div class="hud-layer">
      <header class="hud-header">
        <div>
          <h1 class="hud-title">BACKROOM BILLARD</h1>
          <div class="hud-status-row">
            <span id="status-dot" class="status-dot status-dot--idle"></span>
            <span id="status-text" class="status-text status-text--idle"
              data-i18n="status.ready"
              >Ready to shoot</span
            >
          </div>
          <div class="wallet" data-i18n-aria-label="wallet.aria" aria-label="Cash"><span id="wallet-amount">$ 0</span></div>
          <div id="pocketed-balls" class="pocketed-balls" data-i18n-aria-label="pocketed.aria" aria-label="Pocketed balls"></div>
        </div>

        <div class="hud-actions interactive">
          <div id="lang-switch" class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Language"></div>
          <button id="btn-reset" type="button" class="btn btn--reset" data-i18n="button.rerack">
            Re-rack
          </button>
        </div>
      </header>

      <!-- Condition: two bars, calm in the middle; each with the key button that moves its marker -->
      <div class="meters interactive">
        <div class="meter">
          <button id="btn-drink" type="button" class="btn-key btn-key--compact">
            <span class="btn-key__cap" aria-hidden="true">R</span>
            <span class="btn-key__label" data-i18n="button.drink">Drink</span>
          </button>
          <div class="meter__body">
            <div class="meter__ends">
              <span data-i18n="meter.thirsty">Thirsty</span>
              <span data-i18n="meter.drunk">Drunk</span>
            </div>
            <div class="meter__track"><div id="marker-body" class="meter__marker"></div></div>
          </div>
        </div>
        <div class="meter">
          <button id="btn-smoke" type="button" class="btn-key btn-key--compact">
            <span class="btn-key__cap" aria-hidden="true">T</span>
            <span class="btn-key__label" data-i18n="button.smoke">Smoke</span>
            <span id="pack-count" class="btn-key__badge" data-i18n-aria-label="pack.aria" aria-label="Cigarettes in the pack">20</span>
          </button>
          <div class="meter__body">
            <div class="meter__ends">
              <span data-i18n="meter.nerves">Nerves</span>
              <span data-i18n="meter.desire">Desire</span>
            </div>
            <div class="meter__track"><div id="marker-nicotine" class="meter__marker"></div></div>
          </div>
        </div>
      </div>

      <div id="aim-crosshair" class="aim-crosshair">
        <div class="aim-crosshair__ring">
          <div class="aim-crosshair__dot"></div>
        </div>
      </div>

      <footer class="hud-footer">
        <div class="footer-actions interactive">
          <button id="btn-camera" type="button" class="btn-key btn-key--wide">
            <span class="btn-key__cap" aria-hidden="true">C</span>
            <span class="btn-key__label">
              <span id="cam-label">Player</span>
              <span data-i18n="camera.label">Camera</span>
            </span>
          </button>
        </div>
      </footer>

      <!-- Power: vertical, colored slider (touch friendly), 1 % steps -->
      <div class="power-dock interactive">
        <span id="power-percent" class="power-dock__value">40%</span>
        <div
          id="power-slider"
          class="power-slider"
          role="slider"
          aria-orientation="vertical"
          aria-valuemin="10"
          aria-valuemax="100"
          aria-valuenow="40"
          data-i18n-aria-label="power.label"
          aria-label="Power"
        >
          <div class="power-slider__track">
            <div id="power-dim" class="power-slider__dim"></div>
          </div>
          <div id="power-thumb" class="power-slider__thumb"></div>
        </div>
        <span class="power-dock__label" data-i18n="power.label">Power</span>
      </div>

      <!-- Messages -->
      <div id="toast" class="toast" role="status"></div>

      <!-- Drinks menu: a popover that appears when a glass is empty -->
      <div id="menu" class="menu interactive" hidden>
        <div class="menu__card" role="dialog" aria-labelledby="menu-title">
          <h2 id="menu-title" class="menu__title" data-i18n="menu.title">What would you like?</h2>
          <div id="menu-list" class="menu__list"></div>
        </div>
      </div>

      <!-- Shoot: independent button, bottom center -->
      <div class="fire-dock interactive">
        <div class="fire-disc">
          <button id="btn-fire-shot" type="button" class="btn-fire">
            <svg class="icon icon--sm" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
              <path
                d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"
              />
            </svg>
            <span data-i18n="button.shoot">SHOOT</span>
          </button>
          <span
            id="fire-nub"
            class="fire-nub"
            role="slider"
            data-i18n-aria-label="button.nub"
            aria-label="Cue tip position on the ball"
          ></span>
        </div>
      </div>
    </div>

    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
