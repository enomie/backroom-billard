<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no"
    />
    <title>Backroom Billard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="canvas-container"></div>
    <div class="backroom-vignette"></div>

    <!-- Spielende: Game Lost / Gewonnen -->
    <div id="game-over" class="game-over" hidden>
      <div class="game-over__panel">
        <h2 id="game-over-title" class="game-over__title">GAME LOST</h2>
        <p id="game-over-text" class="game-over__text"></p>
        <button id="btn-restart" type="button" class="btn btn--reset">Neu aufbauen</button>
      </div>
    </div>

    <div class="hud-layer">
      <header class="hud-header">
        <div>
          <h1 class="hud-title">BACKROOM BILLARD</h1>
          <div class="hud-status-row">
            <span id="status-dot" class="status-dot status-dot--idle"></span>
            <span id="status-text" class="status-text status-text--idle"
              >Bereit zum Stoß</span
            >
          </div>
          <div id="pocketed-balls" class="pocketed-balls" aria-label="Versenkte Kugeln"></div>
        </div>

        <div class="hud-actions interactive">
          <button id="btn-camera" type="button" class="btn btn--camera">
            Kamera: <span id="cam-label" class="btn__emphasis">FP Queue</span>
          </button>
          <button id="btn-reset" type="button" class="btn btn--reset">
            Neu aufbauen
          </button>
        </div>
      </header>

      <div id="aim-crosshair" class="aim-crosshair">
        <div class="aim-crosshair__ring">
          <div class="aim-crosshair__dot"></div>
        </div>
      </div>

      <footer class="hud-footer">
        <div class="help-panel interactive">
          <div class="help-panel__title">
            <svg
              class="icon icon--sm"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              ></path>
            </svg>
            Steuerung
          </div>
          <ul class="help-panel__list">
            <li>• <b>Maus ziehen / [A][D]:</b> Zielen</li>
            <li>• <b>Mausrad:</b> Stoßkraft stufenlos einstellen</li>
            <li>• <b>Klick / [Leertaste]:</b> Kugel stoßen</li>
            <li>
              • <b>[C]:</b> Kamera-Wechsel | <b>[R]:</b> Reset
            </li>
          </ul>
        </div>

        <div class="power-bar interactive">
          <div class="power-bar__controls">
            <div class="power-bar__label-row">
              <span>Kraft (Mausrad)</span>
              <span id="power-percent">40%</span>
            </div>
            <input
              id="power-slider"
              type="range"
              min="10"
              max="100"
              value="40"
              class="power-slider"
            />
            <div class="power-bar__track">
              <div id="power-fill" class="power-bar__fill" style="width: 40%"></div>
            </div>
          </div>

          <button id="btn-fire-shot" type="button" class="btn-fire">
            <svg
              class="icon icon--sm"
              fill="currentColor"
              viewBox="0 0 20 20"
              aria-hidden="true"
            >
              <path
                d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.38z"
              />
            </svg>
            <span>STOSSEN</span>
          </button>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/entry.js"></script>
  </body>
</html>
